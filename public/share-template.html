      --forest-ink: #07170f;
      --leaf-a: #78dc44;
      --leaf-b: #3f9b42;
      --leaf-c: #174b2f;
      --wood-dark: #4f2512;
      --wood-mid: #96521f;
      --wood-light: #e0a24b;
      --carrot: #ff6d1d;
      --carrot-tip: #d9320d;
      --gold: #ffe64b;
      --gold-deep: #f28f18;
      --stroke: #3a1e0b;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: #06100b;
    }

    body {
      margin: 0;
      min-width: 1260px;
      padding: 48px 30px;
      background:
        radial-gradient(circle at 50% 0%, rgba(109, 181, 94, 0.28), transparent 34%),
        linear-gradient(180deg, #101b14, #06100b 72%);
      color: #fff;
      font-family: var(--body-font);
    }

    .template-wall {
      display: grid;
      gap: 56px;
      justify-items: center;
      width: max-content;
      margin: 0 auto;
    }

    @supports selector(body:has(:target)) {
      body:has(.share-card:target) {
        min-width: 0;
        padding: 0;
        background: #06100b;
      }

      body:has(.share-card:target) .template-wall {
        display: block;
        width: auto;
        margin: 0;
      }

      body:has(#bobby-share-desktop:target) .share-card:not(#bobby-share-desktop),
      body:has(#bobby-share-mobile:target) .share-card:not(#bobby-share-mobile) {
        display: none;
      }
    }

    .share-card {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 12%, rgba(218, 255, 126, 0.36), transparent 18%),
        radial-gradient(circle at 78% 20%, rgba(105, 189, 89, 0.32), transparent 24%),
        radial-gradient(circle at 50% 76%, rgba(39, 110, 53, 0.50), transparent 34%),
        linear-gradient(160deg, #12391f 0%, #0e2d1c 42%, #081810 100%);
      box-shadow: 0 32px 88px rgba(0, 0, 0, 0.55);
      color: #faffdf;
      font-family: var(--body-font);
    }

    .share-card--desktop {
      width: 1200px;
      height: 720px;
    }

    .share-card--mobile {
      width: 900px;
      height: 1200px;
    }

    .share-card::before,
    .share-card::after {
      content: "";
